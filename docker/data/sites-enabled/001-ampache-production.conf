DocumentRoot /var/www/html/public/

<Directory /var/www/html/public/>
    Options FollowSymLinks
    AllowOverride All
    Require all granted

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</Directory>

# Heresy: TLS is terminated by the reverse proxy (Traefik in Dokploy); it forwards X-Forwarded-Proto
# Heresy: which Ampache already uses to build https links.

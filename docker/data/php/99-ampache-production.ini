; Heresy: production overrides for the Ampache docker image (apache2 and cli SAPIs)

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Heresy: give catalog scans / transcoding room to work
memory_limit = 512M
max_execution_time = 600
max_input_time = 600

; Heresy: allow large uploads (art, media, backups)
upload_max_filesize = 1024M
post_max_size = 1024M

date.timezone = Europe/Madrid
